# main ブランチにファイルが送られるたびに、サイトを組み立てて GitHub Pages に公開します。
name: GitHub Pagesに公開

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHubの画面から手動でも実行できるようにする
  schedule:
    # 毎朝7時15分（日本時間）にも組み立てなおす。
    # 「車内の読み物」で、公開日が今日になった話を自動で出すため。
    - cron: '15 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
