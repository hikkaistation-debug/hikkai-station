# main ブランチにファイルが送られるたびに、サイトを組み立てて GitHub Pages に公開します。
name: GitHub Pagesに公開

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHubの画面から手動でも実行できるようにする
  schedule:
    # 毎日0時5分（日本時間）すぎに、公開日が今日になった「車内の読み物」の話を自動で出す。
    # GitHub Pages は、前と同じコミットをもう一度送ってもサイトを置きかえない（2026-11-07 に判明）。
    # そこで夜中は、下の daily で「中身のない印のコミット」を作ってから、組み立てなおしを頼む。
    - cron: '5 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 夜中（schedule）のときだけ動く：今日が公開日の話があれば、印のコミットを作って
  # このワークフローを手動実行（workflow_dispatch）で呼び直す（新しいコミットで組み立てて公開される）。
  daily:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: 今日が公開日の話があれば、印のコミットを作って公開を頼む
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          if ! grep -lq "^pubDate: $today" src/content/stories/*/*.md; then
            echo "今日（$today）が公開日の話はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "自動公開：$today の車内の読み物"
          git push
          gh workflow run deploy.yml --ref main

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
