<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">エーサーベイの非公式wikiの4つのメニューと、それぞれにのっていることを並べた図</title>
  <rect width="640" height="354" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">非公式wikiの4つのメニュー</text>
  <rect x="20" y="58" width="293" height="119" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <rect x="20" y="58" width="8" height="119" rx="4" fill="#b45309"/>
  <text x="38" y="84" font-size="16" font-weight="700" fill="#b45309">はじめに</text>
  <text x="38" y="111" font-size="14" fill="#1a1d24">アプリの特徴、よくある質問</text>
  <rect x="327" y="58" width="293" height="119" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <rect x="327" y="58" width="8" height="119" rx="4" fill="#b45309"/>
  <text x="345" y="84" font-size="16" font-weight="700" fill="#b45309">初心者向け</text>
  <text x="345" y="111" font-size="14" fill="#1a1d24">対応する機種、評価版、ライセンスの買い</text>
  <text x="345" y="131" font-size="14" fill="#1a1d24">方、トータルステーションとの初めての接</text>
  <text x="345" y="151" font-size="14" fill="#1a1d24">続、データの出し入れ</text>
  <rect x="20" y="191" width="293" height="99" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <rect x="20" y="191" width="8" height="99" rx="4" fill="#b45309"/>
  <text x="38" y="217" font-size="16" font-weight="700" fill="#b45309">アプリ内のメニュー</text>
  <text x="38" y="244" font-size="14" fill="#1a1d24">現場の管理、トラバース・杭打ち、交点・</text>
  <text x="38" y="264" font-size="14" fill="#1a1d24">面積の計算、座標の計算、ボタンの設定</text>
  <rect x="327" y="191" width="293" height="99" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <rect x="327" y="191" width="8" height="99" rx="4" fill="#b45309"/>
  <text x="345" y="217" font-size="16" font-weight="700" fill="#b45309">その他</text>
  <text x="345" y="244" font-size="14" fill="#1a1d24">写真、バックアップ、Bluetooth接続、一</text>
  <text x="345" y="264" font-size="14" fill="#1a1d24">人での運用、一筆の測量のコツ</text>
  <text x="320" y="308" font-size="13.5" text-anchor="middle" fill="#464c58">利用者がまとめた情報です。対応機種・料金・新しい機能は、必ず公式サイトで確かめてくださ</text>
  <text x="320" y="328" font-size="13.5" text-anchor="middle" fill="#464c58">い。</text>
</svg>
