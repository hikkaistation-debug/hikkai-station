<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">登記記録の表題部と権利部、および土地や建物の姿が変わったときにする表題部の登記と申請の義務の有無を示す図</title>
  <rect width="640" height="490" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b62b4"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">表題部にする登記（表示に関する登記）</text>
  <rect x="20" y="56" width="290" height="62" rx="8" fill="#e7f0fa" stroke="#0b62b4" stroke-width="2"/>
  <text x="165" y="82" font-size="18" font-weight="700" text-anchor="middle" fill="#0b62b4">表題部</text>
  <text x="165" y="104" font-size="12.5" text-anchor="middle" fill="#464c58">土地・建物そのものの姿 ― 土地家屋調査士</text>
  <rect x="330" y="56" width="290" height="62" rx="8" fill="#f4f3ee" stroke="#8a93a3" stroke-width="2"/>
  <text x="475" y="82" font-size="18" font-weight="700" text-anchor="middle" fill="#464c58">権利部</text>
  <text x="475" y="104" font-size="12.5" text-anchor="middle" fill="#464c58">持ち主・担保などの権利 ― 司法書士</text>
  <text x="165" y="148" font-size="14" font-weight="700" text-anchor="middle" fill="#464c58">こんなとき</text>
  <text x="475" y="148" font-size="14" font-weight="700" text-anchor="middle" fill="#464c58">表題部にする登記</text>
  <rect x="20" y="164" width="290" height="34" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="36" y="186" font-size="14.5" text-anchor="start" fill="#1a1d24">建物を新しく建てた</text>
  <line x1="314" y1="181" x2="354" y2="181" stroke="#0b62b4" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="358" y="164" width="262" height="34" rx="6" fill="#e7f0fa" stroke="#0b62b4" stroke-width="2"/>
  <text x="372" y="186" font-size="14.5" font-weight="700" text-anchor="start" fill="#1a1d24">建物表題登記</text>
  <text x="608" y="186" font-size="12.5" font-weight="700" text-anchor="end" fill="#c4122f">義務あり</text>
  <rect x="20" y="208" width="290" height="34" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="36" y="230" font-size="14.5" text-anchor="start" fill="#1a1d24">建物を取りこわした</text>
  <line x1="314" y1="225" x2="354" y2="225" stroke="#0b62b4" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="358" y="208" width="262" height="34" rx="6" fill="#e7f0fa" stroke="#0b62b4" stroke-width="2"/>
  <text x="372" y="230" font-size="14.5" font-weight="700" text-anchor="start" fill="#1a1d24">建物滅失登記</text>
  <text x="608" y="230" font-size="12.5" font-weight="700" text-anchor="end" fill="#c4122f">義務あり</text>
  <rect x="20" y="252" width="290" height="34" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="36" y="274" font-size="14.5" text-anchor="start" fill="#1a1d24">増築した・種類や構造が変わった</text>
  <line x1="314" y1="269" x2="354" y2="269" stroke="#0b62b4" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="358" y="252" width="262" height="34" rx="6" fill="#e7f0fa" stroke="#0b62b4" stroke-width="2"/>
  <text x="372" y="274" font-size="14.5" font-weight="700" text-anchor="start" fill="#1a1d24">建物表題部変更登記</text>
  <text x="608" y="274" font-size="12.5" font-weight="700" text-anchor="end" fill="#c4122f">義務あり</text>
  <rect x="20" y="296" width="290" height="34" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="36" y="318" font-size="14.5" text-anchor="start" fill="#1a1d24">土地の使い道が変わった</text>
  <line x1="314" y1="313" x2="354" y2="313" stroke="#0b62b4" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="358" y="296" width="262" height="34" rx="6" fill="#e7f0fa" stroke="#0b62b4" stroke-width="2"/>
  <text x="372" y="318" font-size="14.5" font-weight="700" text-anchor="start" fill="#1a1d24">地目変更登記</text>
  <text x="608" y="318" font-size="12.5" font-weight="700" text-anchor="end" fill="#c4122f">義務あり</text>
  <rect x="20" y="340" width="290" height="34" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="36" y="362" font-size="14.5" text-anchor="start" fill="#1a1d24">1つの土地を分けたい</text>
  <line x1="314" y1="357" x2="354" y2="357" stroke="#0b62b4" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="358" y="340" width="262" height="34" rx="6" fill="#ffffff" stroke="#0b62b4" stroke-width="2"/>
  <text x="372" y="362" font-size="14.5" font-weight="700" text-anchor="start" fill="#1a1d24">分筆登記</text>
  <text x="608" y="362" font-size="12.5" font-weight="700" text-anchor="end" fill="#464c58">義務なし</text>
  <rect x="20" y="384" width="290" height="34" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="36" y="406" font-size="14.5" text-anchor="start" fill="#1a1d24">となりの土地とまとめたい</text>
  <line x1="314" y1="401" x2="354" y2="401" stroke="#0b62b4" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="358" y="384" width="262" height="34" rx="6" fill="#ffffff" stroke="#0b62b4" stroke-width="2"/>
  <text x="372" y="406" font-size="14.5" font-weight="700" text-anchor="start" fill="#1a1d24">合筆登記</text>
  <text x="608" y="406" font-size="12.5" font-weight="700" text-anchor="end" fill="#464c58">義務なし</text>
  <text x="320" y="450" font-size="13.5" text-anchor="middle" fill="#464c58">「義務あり」の登記は、1か月以内に申請します。</text>
  <text x="320" y="472" font-size="13.5" text-anchor="middle" fill="#464c58">分筆・合筆は義務ではなく、持ち主が申請するかどうかを決めます。</text>
</svg>
