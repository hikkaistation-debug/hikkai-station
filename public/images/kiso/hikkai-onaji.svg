<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">ふだんは、筆界と所有権の境が同じ場所にある図</title>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">ふだん：筆界と所有権の境は同じ場所</text>
  <rect x="40" y="60" width="280" height="170" fill="#eef2f8" stroke="#8a93a3" stroke-width="2"/>
  <rect x="320" y="60" width="280" height="170" fill="#f3efe6" stroke="#8a93a3" stroke-width="2"/>
  <text x="180" y="140" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">1番の土地</text>
  <text x="180" y="168" font-size="16" text-anchor="middle" fill="#464c58">Aさんのもの</text>
  <text x="460" y="140" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">2番の土地</text>
  <text x="460" y="168" font-size="16" text-anchor="middle" fill="#464c58">Bさんのもの</text>
  <line x1="320" y1="52" x2="320" y2="238" stroke="#1f2a44" stroke-width="7"/>
  <line x1="320" y1="52" x2="320" y2="238" stroke="#c4122f" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="320" y="262" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">筆界 ＝ 所有権の境（重なっている）</text>
  <g font-size="14" fill="#1a1d24">
    <line x1="60" y1="285" x2="100" y2="285" stroke="#1f2a44" stroke-width="7"/>
    <text x="108" y="290">筆界（太い実線）</text>
    <line x1="330" y1="285" x2="370" y2="285" stroke="#c4122f" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="378" y="290">所有権の境（赤い点線）</text>
  </g>
</svg>
