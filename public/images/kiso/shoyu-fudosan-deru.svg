<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">今の住所で所有不動産記録証明書を請求すると、登記簿の住所が今と同じ実家の土地は出るが、引っ越し前の住所のままの山林は出ないことを示す図</title>
  <rect width="640" height="350" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b62b4"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">登記簿の住所が古いままだと、一覧に出ない</text>
  <rect x="20" y="62" width="200" height="96" rx="8" fill="#e7f0fa" stroke="#0b62b4" stroke-width="2"/>
  <text x="120" y="90" font-size="16" font-weight="700" text-anchor="middle" fill="#0b62b4">今の住所で検索</text>
  <text x="120" y="114" font-size="13.5" text-anchor="middle" fill="#464c58">所有不動産記録</text>
  <text x="120" y="132" font-size="13.5" text-anchor="middle" fill="#464c58">証明書を請求</text>
  <line x1="224" y1="96" x2="296" y2="86" stroke="#0b62b4" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="224" y1="124" x2="296" y2="214" stroke="#0b62b4" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="300" y="56" width="320" height="72" rx="8" fill="#e8f4ec" stroke="#0a7d3e" stroke-width="2"/>
  <text x="316" y="82" font-size="15" font-weight="700" text-anchor="start" fill="#1a1d24">実家の土地</text>
  <text x="316" y="106" font-size="13.5" text-anchor="start" fill="#464c58">登記簿の住所：今の住所と同じ</text>
  <text x="604" y="98" font-size="20" font-weight="700" text-anchor="end" fill="#0a7d3e">出る</text>
  <rect x="300" y="176" width="320" height="72" rx="8" fill="#fdecef" stroke="#c4122f" stroke-width="2"/>
  <text x="316" y="202" font-size="15" font-weight="700" text-anchor="start" fill="#1a1d24">昔買った山林</text>
  <text x="316" y="226" font-size="13.5" text-anchor="start" fill="#464c58">登記簿の住所：引っ越し前のまま</text>
  <text x="604" y="218" font-size="20" font-weight="700" text-anchor="end" fill="#c4122f">出ない</text>
  <text x="460" y="270" font-size="13.5" font-weight="700" text-anchor="middle" fill="#464c58">→ 昔の住所でも検索すると出る</text>
  <text x="320" y="306" font-size="13.5" text-anchor="middle" fill="#464c58">所有権の登記がない不動産や、コンピュータ化されていない不動産なども出ません。</text>
  <text x="320" y="330" font-size="13.5" text-anchor="middle" fill="#464c58">固定資産税の通知書や古い権利証とも見くらべましょう。</text>
</svg>
