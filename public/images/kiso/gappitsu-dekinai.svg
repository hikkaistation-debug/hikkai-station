<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">合筆できない代表的な例。土地がつながっていない、地目がちがう、持ち主や持分がちがう、片方にだけ抵当権が付いている</title>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="32" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">こんなときは、まとめられない（代表的な例）</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <!-- つながっていない -->
    <g transform="translate(14,56)">
      <rect width="146" height="200" rx="10" fill="#f7f6f2" stroke="#d5d3cc"/>
      <rect x="14" y="40" width="44" height="80" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/>
      <rect x="62" y="40" width="20" height="80" fill="#8a93a3"/>
      <rect x="86" y="40" width="44" height="80" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/>
      <text x="72" y="34" font-size="11" font-weight="400" fill="#464c58">道路</text>
      <text x="73" y="152" fill="#1f2a44">つながって</text><text x="73" y="172" fill="#1f2a44">いない</text>
      <text x="73" y="22" fill="#c4122f">×</text>
    </g>
    <!-- 地目 -->
    <g transform="translate(170,56)">
      <rect width="146" height="200" rx="10" fill="#f7f6f2" stroke="#d5d3cc"/>
      <rect x="18" y="40" width="55" height="80" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/>
      <rect x="73" y="40" width="55" height="80" fill="#e6f0d6" stroke="#1f2a44" stroke-width="2"/>
      <text x="45" y="86" font-size="13" fill="#1f2a44">宅地</text><text x="100" y="86" font-size="13" fill="#3d6b1f">畑</text>
      <text x="73" y="152" fill="#1f2a44">地目が</text><text x="73" y="172" fill="#1f2a44">ちがう</text>
      <text x="73" y="22" fill="#c4122f">×</text>
    </g>
    <!-- 持ち主 -->
    <g transform="translate(326,56)">
      <rect width="146" height="200" rx="10" fill="#f7f6f2" stroke="#d5d3cc"/>
      <rect x="18" y="40" width="55" height="80" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/>
      <rect x="73" y="40" width="55" height="80" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/>
      <text x="45" y="86" font-size="13" fill="#1f2a44">Aさん</text><text x="100" y="86" font-size="13" fill="#c4122f">Bさん</text>
      <text x="73" y="152" fill="#1f2a44">持ち主・持分が</text><text x="73" y="172" fill="#1f2a44">ちがう</text>
      <text x="73" y="22" fill="#c4122f">×</text>
    </g>
    <!-- 抵当権 -->
    <g transform="translate(482,56)">
      <rect width="146" height="200" rx="10" fill="#f7f6f2" stroke="#d5d3cc"/>
      <rect x="18" y="40" width="55" height="80" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/>
      <rect x="73" y="40" width="55" height="80" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/>
      <rect x="82" y="58" width="36" height="22" rx="4" fill="#c4122f"/><text x="100" y="74" font-size="11" fill="#fff">抵当権</text>
      <text x="73" y="152" fill="#1f2a44">片方にだけ</text><text x="73" y="172" fill="#1f2a44">抵当権など</text>
      <text x="73" y="22" fill="#c4122f">×</text>
    </g>
  </g>
  <text x="320" y="286" font-size="13" text-anchor="middle" fill="#464c58">地目は、先に地目変更の登記でそろえれば、まとめられることがあります（くわしくは下の表）。</text>
</svg>
