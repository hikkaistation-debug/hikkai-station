<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 299" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">土地家屋調査士試験の学び方として、通学・通信講座・独学の3つについて、向いている人と気をつけたいことを並べた図</title>
  <rect width="640" height="299" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">学び方は大きく3つ</text>
  <rect x="20" y="58" width="190.66666666666666" height="197" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="20" y="58" width="8" height="197" rx="4" fill="#0f766e"/>
  <text x="38" y="84" font-size="16" font-weight="700" fill="#0f766e">通学</text>
  <text x="38" y="103" font-size="12.5" fill="#464c58">教室で受講</text>
  <text x="38" y="129" font-size="14" fill="#1a1d24">向いている人：決まった</text>
  <text x="38" y="149" font-size="14" fill="#1a1d24">時間に学ぶほうが続く人、</text>
  <text x="38" y="169" font-size="14" fill="#1a1d24">講師に直接質問したい人。</text>
  <text x="38" y="189" font-size="14" fill="#1a1d24">気をつけたい：校舎が近</text>
  <text x="38" y="209" font-size="14" fill="#1a1d24">くにあるか、費用は高め</text>
  <text x="38" y="229" font-size="14" fill="#1a1d24">になりやすい</text>
  <rect x="224.66666666666666" y="58" width="190.66666666666666" height="197" rx="10" fill="#ffffff" stroke="#0b62b4" stroke-width="2"/>
  <rect x="224.66666666666666" y="58" width="8" height="197" rx="4" fill="#0b62b4"/>
  <text x="242.66666666666666" y="84" font-size="16" font-weight="700" fill="#0b62b4">通信講座</text>
  <text x="242.66666666666666" y="103" font-size="12.5" fill="#464c58">動画・テキスト</text>
  <text x="242.66666666666666" y="129" font-size="14" fill="#1a1d24">向いている人：仕事をし</text>
  <text x="242.66666666666666" y="149" font-size="14" fill="#1a1d24">ながら、自分のペースで</text>
  <text x="242.66666666666666" y="169" font-size="14" fill="#1a1d24">学びたい人。気をつけた</text>
  <text x="242.66666666666666" y="189" font-size="14" fill="#1a1d24">い：一人でも計画どおり</text>
  <text x="242.66666666666666" y="209" font-size="14" fill="#1a1d24">進められるか</text>
  <rect x="429.3333333333333" y="58" width="190.66666666666666" height="197" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <rect x="429.3333333333333" y="58" width="8" height="197" rx="4" fill="#b45309"/>
  <text x="447.3333333333333" y="84" font-size="16" font-weight="700" fill="#b45309">独学</text>
  <text x="447.3333333333333" y="103" font-size="12.5" fill="#464c58">市販の本・過去問</text>
  <text x="447.3333333333333" y="129" font-size="14" fill="#1a1d24">向いている人：費用をお</text>
  <text x="447.3333333333333" y="149" font-size="14" fill="#1a1d24">さえたい人、測量や登記</text>
  <text x="447.3333333333333" y="169" font-size="14" fill="#1a1d24">の基礎がある人。気をつ</text>
  <text x="447.3333333333333" y="189" font-size="14" fill="#1a1d24">けたい：記述式の書き方</text>
  <text x="447.3333333333333" y="209" font-size="14" fill="#1a1d24">を自分で身につける必要</text>
  <text x="447.3333333333333" y="229" font-size="14" fill="#1a1d24">がある</text>
  <text x="320" y="273" font-size="13.5" text-anchor="middle" fill="#464c58">午前の部の免除を使うなら、測量士補の試験（例年5月ごろ）から計画します。</text>
</svg>
