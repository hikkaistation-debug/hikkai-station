<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">地面の動き方を3つに分けた図。地殻変動で広い範囲がまとまって動いたときは、筆界も一緒に動いたものとして扱う。崖崩れなど局部的な土砂の移動と、液状化による側方流動では、筆界は動かないものとして扱う</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
  <text x="320" y="32" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1d24">地面がどう動いたかで、筆界の扱いが分かれる</text>

  <!-- 1 地殻変動 -->
  <rect x="10" y="50" width="200" height="290" rx="12" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="110" y="78" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">地殻変動</text>
  <text x="110" y="98" font-size="12" text-anchor="middle" fill="#464c58">広い範囲の地面が</text>
  <text x="110" y="114" font-size="12" text-anchor="middle" fill="#464c58">まとまって水平に動く</text>
  <g fill="none" stroke="#8a93a3" stroke-width="2.5" stroke-dasharray="6 4"><rect x="34" y="134" width="64" height="52"/><rect x="98" y="134" width="64" height="52"/></g>
  <g fill="none" stroke="#1f2a44" stroke-width="2.5"><rect x="56" y="156" width="64" height="52"/><rect x="120" y="156" width="64" height="52"/></g>
  <line x1="42" y1="142" x2="66" y2="160" stroke="#b45309" stroke-width="3" marker-end="url(#a)"/>
  <text x="110" y="232" font-size="12" text-anchor="middle" fill="#464c58">まわりと一緒に、同じ向きに動く</text>
  <rect x="22" y="248" width="176" height="56" rx="8" fill="#b45309"/>
  <text x="110" y="272" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">筆界も一緒に</text>
  <text x="110" y="292" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">動いたと扱う</text>
  <text x="110" y="326" font-size="11" text-anchor="middle" fill="#464c58">平成7年 民事局長回答</text>

  <!-- 2 局部的な土砂の移動 -->
  <rect x="220" y="50" width="200" height="290" rx="12" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="320" y="78" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">局部的な土砂の移動</text>
  <text x="320" y="98" font-size="12" text-anchor="middle" fill="#464c58">崖崩れなどで、</text>
  <text x="320" y="114" font-size="12" text-anchor="middle" fill="#464c58">一部の土砂が動く</text>
  <g fill="none" stroke="#8a93a3" stroke-width="2.5" stroke-dasharray="6 4"><rect x="252" y="140" width="68" height="56"/><rect x="320" y="140" width="68" height="56"/></g>
  <path d="M352,150 Q380,150 386,176 Q392,206 372,214 Q350,220 340,206 Q332,190 340,170 Z" fill="#b45309" fill-opacity="0.18" stroke="#1f2a44" stroke-width="2.5"/>
  <line x1="352" y1="166" x2="366" y2="200" stroke="#b45309" stroke-width="3" marker-end="url(#a)"/>
  <text x="320" y="232" font-size="12" text-anchor="middle" fill="#464c58">規模が大きくても同じ</text>
  <rect x="232" y="248" width="176" height="56" rx="8" fill="#ffffff" stroke="#1f2a44" stroke-width="2.5"/>
  <text x="320" y="272" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a44">筆界は</text>
  <text x="320" y="292" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a44">動かないと扱う</text>
  <text x="320" y="326" font-size="11" text-anchor="middle" fill="#464c58">平成7年 民事局長回答</text>

  <!-- 3 側方流動 -->
  <rect x="430" y="50" width="200" height="290" rx="12" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="530" y="78" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">液状化による側方流動</text>
  <text x="530" y="98" font-size="12" text-anchor="middle" fill="#464c58">液状化した地盤が、</text>
  <text x="530" y="114" font-size="12" text-anchor="middle" fill="#464c58">横に流れるように動く</text>
  <g fill="none" stroke="#8a93a3" stroke-width="2.5" stroke-dasharray="6 4"><rect x="462" y="140" width="68" height="56"/><rect x="530" y="140" width="68" height="56"/></g>
  <path d="M472,146 Q506,160 552,150 L592,150 L592,192 L552,192 Q506,206 472,192 Z" fill="#b45309" fill-opacity="0.12" stroke="#1f2a44" stroke-width="2.5"/>
  <line x1="552" y1="150" x2="552" y2="192" stroke="#1f2a44" stroke-width="2.5"/>
  <text x="530" y="232" font-size="12" text-anchor="middle" fill="#464c58">地殻変動をともなうものではない</text>
  <rect x="442" y="248" width="176" height="56" rx="8" fill="#ffffff" stroke="#1f2a44" stroke-width="2.5"/>
  <text x="530" y="272" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a44">筆界は</text>
  <text x="530" y="292" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a44">動かないと扱う</text>
  <text x="530" y="326" font-size="11" text-anchor="middle" fill="#464c58">法務省の考え方（2025年）</text>

  <!-- 凡例 -->
  <line x1="120" y1="368" x2="160" y2="368" stroke="#8a93a3" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="168" y="372" font-size="13" fill="#1a1d24">点線＝地図の筆界</text>
  <line x1="340" y1="368" x2="380" y2="368" stroke="#1f2a44" stroke-width="2.5"/>
  <text x="388" y="372" font-size="13" fill="#1a1d24">実線＝今の土地の形</text>
  <text x="320" y="392" font-size="11" text-anchor="middle" fill="#464c58">1つの地震でも、場所によって動き方はちがいます</text>
</svg>
