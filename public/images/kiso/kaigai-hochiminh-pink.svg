<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">ベトナム・ホーチミン市で作業部会が問題を取り除いてピンクブックの発行を認める流れと、日本で新築マンションを買ったときの表題登記と所有権の保存の登記の流れを比べる図</title>
  <rect width="640" height="365" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">マンションの権利の証明・登記</text>
  <rect x="20" y="58" width="290" height="58" rx="8" fill="#b45309"/>
  <text x="165" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">ベトナム・ホーチミン市</text>
  <text x="165" y="105" font-size="13" text-anchor="middle" fill="#fff">（記事より）</text>
  <rect x="20" y="130" width="290" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="155" font-size="14.5" fill="#1a1d24">買った人に「ピンクブック」（権利の証</text>
  <text x="34" y="176" font-size="14.5" fill="#1a1d24">明書）が出ないプロジェクトが多い</text>
  <line x1="165" y1="192" x2="165" y2="210" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="20" y="214" width="290" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="239" font-size="14.5" fill="#1a1d24">市の作業部会1645が、1件ずつ問題を取</text>
  <text x="34" y="260" font-size="14.5" fill="#1a1d24">り除く</text>
  <line x1="165" y1="276" x2="165" y2="294" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="20" y="298" width="290" height="39" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="323" font-size="14.5" fill="#1a1d24">買った人に証明書を出すことを認める</text>
  <rect x="330" y="58" width="290" height="58" rx="8" fill="#0a7d3e"/>
  <text x="475" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">日本</text>
  <text x="475" y="105" font-size="13" text-anchor="middle" fill="#fff">（不動産登記法）</text>
  <rect x="330" y="130" width="290" height="60" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="155" font-size="14.5" fill="#1a1d24">① 建物の表題登記：1棟のすべての部</text>
  <text x="344" y="176" font-size="14.5" fill="#1a1d24">屋をまとめて申請（ふつうは分譲会社）</text>
  <line x1="475" y1="192" x2="475" y2="210" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="330" y="214" width="290" height="60" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="239" font-size="14.5" fill="#1a1d24">② 所有権の保存の登記：分譲会社から</text>
  <text x="344" y="260" font-size="14.5" fill="#1a1d24">買った人も申請できる</text>
</svg>
