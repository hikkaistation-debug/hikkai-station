<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">韓国と日本で、登記を扱うところ・登記を見られる人・家にいながら見る方法を比べる図</title>
  <rect width="640" height="318" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">韓国と日本の登記のしくみ</text>
  <rect x="20" y="58" width="290" height="40" rx="8" fill="#0b62b4"/>
  <text x="165" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">韓国</text>
  <rect x="20" y="112" width="290" height="39" rx="8" fill="#ffffff" stroke="#0b62b4" stroke-width="2"/>
  <text x="34" y="137" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">扱うところ</tspan>：裁判所</text>
  <rect x="20" y="161" width="290" height="39" rx="8" fill="#ffffff" stroke="#0b62b4" stroke-width="2"/>
  <text x="34" y="186" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">見られる人</tspan>：だれでも</text>
  <rect x="20" y="210" width="290" height="39" rx="8" fill="#ffffff" stroke="#0b62b4" stroke-width="2"/>
  <text x="34" y="235" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">家から見る</tspan>：インターネットの登記所</text>
  <rect x="330" y="58" width="290" height="40" rx="8" fill="#0a7d3e"/>
  <text x="475" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">日本</text>
  <rect x="330" y="112" width="290" height="39" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="137" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">扱うところ</tspan>：法務局（法務省）</text>
  <rect x="330" y="161" width="290" height="60" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="186" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">見られる人</tspan>：だれでも（手数料を払って</text>
  <text x="344" y="207" font-size="14.5" fill="#1a1d24">登記事項証明書）</text>
  <rect x="330" y="231" width="290" height="39" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="256" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">家から見る</tspan>：登記情報提供サービス</text>
  <text x="320" y="290" font-size="13.5" text-anchor="middle" fill="#464c58">記事の指数は、区ごとの2014年の月平均を100として、閲覧・発行の回数を比べたものです。</text>
</svg>
