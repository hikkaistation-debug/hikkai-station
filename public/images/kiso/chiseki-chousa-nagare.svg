<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 339" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">地籍調査で土地の持ち主がすることを4つの段階で示す図</title>
  <rect width="640" height="339" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">地籍調査で、持ち主がすること</text>
  <line x1="50" y1="79" x2="50" y2="247" stroke="#6d28a8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="50" cy="79" r="13" fill="#fff" stroke="#6d28a8" stroke-width="4"/>
  <text x="50" y="84" font-size="14" font-weight="700" text-anchor="middle" fill="#6d28a8">1</text>
  <text x="76" y="85" font-size="17" font-weight="700" fill="#1a1d24">市町村からお知らせが届く</text>
  <circle cx="50" cy="121" r="13" fill="#fff" stroke="#6d28a8" stroke-width="4"/>
  <text x="50" y="126" font-size="14" font-weight="700" text-anchor="middle" fill="#6d28a8">2</text>
  <text x="76" y="127" font-size="17" font-weight="700" fill="#1a1d24">現地で立ち会う</text>
  <text x="76" y="151" font-size="14.5" fill="#464c58">お隣と一緒に、境目を確認します</text>
  <circle cx="50" cy="184" r="13" fill="#fff" stroke="#6d28a8" stroke-width="4"/>
  <text x="50" y="189" font-size="14" font-weight="700" text-anchor="middle" fill="#6d28a8">3</text>
  <text x="76" y="190" font-size="17" font-weight="700" fill="#1a1d24">調査の結果を確認する</text>
  <text x="76" y="214" font-size="14.5" fill="#464c58">地籍図・地籍簿の案を確認します（閲覧期間があります）</text>
  <circle cx="50" cy="247" r="13" fill="#fff" stroke="#6d28a8" stroke-width="4"/>
  <text x="50" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#6d28a8">4</text>
  <text x="76" y="253" font-size="17" font-weight="700" fill="#1a1d24">法務局で登記が直される</text>
  <text x="76" y="277" font-size="14.5" fill="#464c58">地籍図が<tspan font-weight="700">14条1項地図</tspan>として備え付けられ、測り直した面積に登記が直されます</text>
  <text x="30" y="305" font-size="14" fill="#464c58">持ち主の費用負担はありません。</text>
</svg>
