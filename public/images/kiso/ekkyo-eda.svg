<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">隣の木の枝が境界を越えているときに、自分で切り取れる3つの場合を示す図</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">越境した枝を、自分で切れるのは？</text>
  <rect x="20" y="60" width="200" height="190" fill="#f3efe6"/>
  <rect x="220" y="60" width="200" height="190" fill="#eef2f8"/>
  <line x1="220" y1="60" x2="220" y2="250" stroke="#c4122f" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="220" y="272" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c4122f">境界</text>
  <text x="80" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#464c58">お隣の土地</text>
  <text x="330" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#464c58">自分の土地</text>
  <rect x="112" y="150" width="16" height="80" fill="#7a5230"/>
  <ellipse cx="120" cy="130" rx="70" ry="50" fill="#5f9a4a"/>
  <path d="M150,120 Q220,96 300,110" fill="none" stroke="#7a5230" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="290" cy="106" rx="34" ry="20" fill="#5f9a4a" fill-opacity="0.9"/>
  <text x="300" y="150" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a1d24">境界を越えた枝</text>
  <rect x="436" y="60" width="184" height="190" rx="10" fill="#fff" stroke="#8a93a3" stroke-width="2"/>
  <text x="528" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">まずは、お隣と</text>
  <text x="528" y="108" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">話し合うのが基本</text>
  <text x="528" y="140" font-size="13.5" text-anchor="middle" fill="#464c58">次のどれかに</text>
  <text x="528" y="160" font-size="13.5" text-anchor="middle" fill="#464c58">当てはまれば、</text>
  <text x="528" y="180" font-size="13.5" text-anchor="middle" fill="#464c58">自分で切り取れます</text>
  <text x="528" y="206" font-size="12.5" text-anchor="middle" fill="#464c58">（民法第233条第3項・</text>
  <text x="528" y="224" font-size="12.5" text-anchor="middle" fill="#464c58">2023年4月から）</text>
  <circle cx="44" cy="292" r="12" fill="#c4122f"/>
  <text x="44" y="297" font-size="13.5" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="66" y="297" font-size="15" text-anchor="start" fill="#1a1d24">切るようお願いしたのに、相当の期間内に切ってくれない</text>
  <circle cx="44" cy="326" r="12" fill="#c4122f"/>
  <text x="44" y="331" font-size="13.5" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="66" y="331" font-size="15" text-anchor="start" fill="#1a1d24">木の持ち主がわからない、またはどこにいるかわからない</text>
  <circle cx="44" cy="360" r="12" fill="#c4122f"/>
  <text x="44" y="365" font-size="13.5" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="66" y="365" font-size="15" text-anchor="start" fill="#1a1d24">急いで切る必要がある</text>
</svg>
