<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">合筆の前と後。となりあう1番と2番の土地をまとめると1つの土地になり、間にあった筆界がなくなる</title>
  <rect width="640" height="290" fill="#ffffff"/>
  <text x="320" y="32" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">合筆の前と後</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#464c58"/></marker></defs>

  <text x="150" y="66" font-size="15" font-weight="700" text-anchor="middle" fill="#464c58">まとめる前</text>
  <rect x="50" y="80" width="100" height="150" fill="#eef1f8" stroke="#1f2a44" stroke-width="3"/>
  <rect x="150" y="80" width="100" height="150" fill="#f1f7ec" stroke="#1f2a44" stroke-width="3"/>
  <text x="100" y="163" font-size="22" font-weight="700" text-anchor="middle" fill="#1f2a44">1番</text>
  <text x="200" y="163" font-size="22" font-weight="700" text-anchor="middle" fill="#1f2a44">2番</text>

  <line x1="272" y1="155" x2="352" y2="155" stroke="#464c58" stroke-width="3" marker-end="url(#a)"/>
  <text x="312" y="142" font-size="14" font-weight="700" text-anchor="middle" fill="#464c58">合筆</text>

  <text x="490" y="66" font-size="15" font-weight="700" text-anchor="middle" fill="#464c58">まとめた後</text>
  <rect x="390" y="80" width="200" height="150" fill="#eef1f8" stroke="#1f2a44" stroke-width="3"/>
  <line x1="490" y1="84" x2="490" y2="226" stroke="#8a93a3" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/>
  <text x="490" y="163" font-size="24" font-weight="700" text-anchor="middle" fill="#1f2a44">1番</text>
  <text x="490" y="262" font-size="13" font-weight="700" text-anchor="middle" fill="#c4122f">間の筆界はなくなる（点線）</text>
  <text x="320" y="284" font-size="13" text-anchor="middle" fill="#464c58">まとめた土地の地番は、ふつう、もとの土地のどちらかの地番になります。</text>
</svg>
