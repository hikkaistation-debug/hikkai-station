<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">スマート変更登記の流れを、検索用情報の申出から法務局が変更の登記をするまでの4つの段階で示す図</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">「スマート変更登記」の流れ</text>
  <line x1="50" y1="79" x2="50" y2="289" stroke="#0b62b4" stroke-width="8" stroke-linecap="round"/>
  <circle cx="50" cy="79" r="13" fill="#fff" stroke="#0b62b4" stroke-width="4"/>
  <text x="50" y="84" font-size="14" font-weight="700" text-anchor="middle" fill="#0b62b4">1</text>
  <text x="76" y="85" font-size="17" font-weight="700" fill="#1a1d24">検索用情報を申し出る（無料）</text>
  <text x="76" y="109" font-size="14.5" fill="#464c58">持ち主が、生年月日などの検索用情報を法務局に申し出ておきます</text>
  <circle cx="50" cy="142" r="13" fill="#fff" stroke="#0b62b4" stroke-width="4"/>
  <text x="50" y="147" font-size="14" font-weight="700" text-anchor="middle" fill="#0b62b4">2</text>
  <text x="76" y="148" font-size="17" font-weight="700" fill="#1a1d24">法務局が変更を確かめる</text>
  <text x="76" y="172" font-size="14.5" fill="#464c58">住民基本台帳ネットワークで、住所などの変更を確かめます</text>
  <circle cx="50" cy="205" r="13" fill="#fff" stroke="#0b62b4" stroke-width="4"/>
  <text x="50" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#0b62b4">3</text>
  <text x="76" y="211" font-size="17" font-weight="700" fill="#1a1d24">意思確認の通知に回答する</text>
  <text x="76" y="235" font-size="14.5" fill="#464c58">法務局から通知が届いたら、<tspan font-weight="700">希望すると回答</tspan>します（回答しないと催告の対象に</text>
  <text x="76" y="256" font-size="14.5" fill="#464c58">なることも）</text>
  <circle cx="50" cy="289" r="13" fill="#fff" stroke="#0b62b4" stroke-width="4"/>
  <text x="50" y="294" font-size="14" font-weight="700" text-anchor="middle" fill="#0b62b4">4</text>
  <text x="76" y="295" font-size="17" font-weight="700" fill="#0b62b4">法務局が変更の登記をする</text>
  <text x="30" y="326" font-size="14" fill="#464c58">個人は2026年12月中旬以降に始まります。海外に住んでいる人は対象外です。</text>
</svg>
