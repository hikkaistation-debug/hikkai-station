<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">ベトナム・ハノイでは警察が人口データベースと照らし合わせて土地のデータを整え、日本では持ち主に変更の登記を義務づけたうえで登記官が住基ネットなどの情報も使うことを比べる図</title>
  <rect width="640" height="386" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">持ち主の情報を新しくするしくみ</text>
  <rect x="20" y="58" width="290" height="58" rx="8" fill="#b45309"/>
  <text x="165" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">ベトナム・ハノイ</text>
  <text x="165" y="105" font-size="13" text-anchor="middle" fill="#fff">（記事より）</text>
  <rect x="20" y="130" width="290" height="39" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="155" font-size="14.5" fill="#1a1d24">警察が農業環境局と組む</text>
  <line x1="165" y1="171" x2="165" y2="189" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="20" y="193" width="290" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="218" font-size="14.5" fill="#1a1d24">国の人口データベースと照らし合わせて、</text>
  <text x="34" y="239" font-size="14.5" fill="#1a1d24">名前や身分証の番号を確かめる</text>
  <line x1="165" y1="255" x2="165" y2="273" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="20" y="277" width="290" height="39" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="302" font-size="14.5" fill="#1a1d24">国の土地データベースを完成させる</text>
  <rect x="330" y="58" width="290" height="58" rx="8" fill="#0a7d3e"/>
  <text x="475" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">日本</text>
  <text x="475" y="105" font-size="13" text-anchor="middle" fill="#fff">（不動産登記法）</text>
  <rect x="330" y="130" width="290" height="60" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="155" font-size="14.5" fill="#1a1d24">相続登記の義務：知った日から3年以内</text>
  <text x="344" y="176" font-size="14.5" fill="#1a1d24">（2024年4月から）</text>
  <line x1="475" y1="192" x2="475" y2="210" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="330" y="214" width="290" height="60" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="239" font-size="14.5" fill="#1a1d24">住所・氏名の変更登記の義務：2年以内</text>
  <text x="344" y="260" font-size="14.5" fill="#1a1d24">（2026年4月から）</text>
  <line x1="475" y1="276" x2="475" y2="294" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="330" y="298" width="290" height="60" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="323" font-size="14.5" fill="#1a1d24">登記官が住基ネットなどの情報で職権で</text>
  <text x="344" y="344" font-size="14.5" fill="#1a1d24">変更（個人は本人の申出があるとき）</text>
</svg>
