<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">受信機1台で位置を出す単独測位と、基準局と通信でつないでその場で位置を出すRTK測位を比べる図</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">単独測位とRTK測位</text>
  <line x1="320" y1="56" x2="320" y2="300" stroke="#8a93a3" stroke-width="1" stroke-dasharray="4 4"/>
  <g transform="translate(90,80)"><rect x="-8" y="-8" width="16" height="16" fill="#1f2a44"/><rect x="-30" y="-5" width="18" height="10" fill="#0b62b4"/><rect x="12" y="-5" width="18" height="10" fill="#0b62b4"/></g>
  <g transform="translate(230,96)"><rect x="-8" y="-8" width="16" height="16" fill="#1f2a44"/><rect x="-30" y="-5" width="18" height="10" fill="#0b62b4"/><rect x="12" y="-5" width="18" height="10" fill="#0b62b4"/></g>
  <g transform="translate(400,80)"><rect x="-8" y="-8" width="16" height="16" fill="#1f2a44"/><rect x="-30" y="-5" width="18" height="10" fill="#0b62b4"/><rect x="12" y="-5" width="18" height="10" fill="#0b62b4"/></g>
  <g transform="translate(560,96)"><rect x="-8" y="-8" width="16" height="16" fill="#1f2a44"/><rect x="-30" y="-5" width="18" height="10" fill="#0b62b4"/><rect x="12" y="-5" width="18" height="10" fill="#0b62b4"/></g>
  <g stroke="#0b62b4" stroke-width="1.5" stroke-dasharray="5 4"><line x1="90" y1="88" x2="160" y2="186"/><line x1="230" y1="104" x2="160" y2="186"/><line x1="400" y1="88" x2="400" y2="186"/><line x1="400" y1="88" x2="560" y2="186"/><line x1="560" y1="104" x2="400" y2="186"/><line x1="560" y1="104" x2="560" y2="186"/></g>
  <g><line x1="160" y1="190" x2="160" y2="250" stroke="#1f2a44" stroke-width="4"/><ellipse cx="160" cy="190" rx="16" ry="7" fill="#be185d"/></g>  <text x="160" y="272" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a1d24">受信機1台</text>
  <g><line x1="400" y1="190" x2="400" y2="250" stroke="#1f2a44" stroke-width="4"/><ellipse cx="400" cy="190" rx="16" ry="7" fill="#be185d"/></g>  <text x="400" y="272" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a1d24">基準局</text>
  <g><line x1="560" y1="190" x2="560" y2="250" stroke="#1f2a44" stroke-width="4"/><ellipse cx="560" cy="190" rx="16" ry="7" fill="#be185d"/></g>  <text x="560" y="272" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a1d24">測る点</text>
  <path d="M410,212 Q480,246 550,212" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="480" y="222" font-size="13" font-weight="700" text-anchor="middle" fill="#b45309">通信</text>
  <text x="160" y="300" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">単独測位</text>
  <text x="160" y="322" font-size="13.5" text-anchor="middle" fill="#464c58">スマートフォン、カーナビ</text>
  <text x="480" y="300" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">RTK測位</text>
  <text x="480" y="322" font-size="13" text-anchor="middle" fill="#464c58">基準局と通信でつなぎ、その場で位置を出す</text>
  <text x="480" y="340" font-size="13" text-anchor="middle" fill="#464c58">測量、工事、農業機械</text>
</svg>
