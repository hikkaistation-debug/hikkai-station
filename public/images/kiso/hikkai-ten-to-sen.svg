<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">筆界は、筆界点とそれを結ぶ直線でできていることを示す図</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">筆界は「点」と「点を結ぶ直線」</text>
  <!-- 1番の土地 -->
  <polygon points="40,60 330,60 300,150 345,250 40,250" fill="#eef2f8" stroke="#8a93a3" stroke-width="2"/>
  <!-- 2番の土地 -->
  <polygon points="330,60 600,60 600,250 345,250 300,150" fill="#f3efe6" stroke="#8a93a3" stroke-width="2"/>
  <text x="170" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">1番の土地</text>
  <text x="170" y="176" font-size="15" text-anchor="middle" fill="#464c58">（1筆）</text>
  <text x="470" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">2番の土地</text>
  <text x="470" y="176" font-size="15" text-anchor="middle" fill="#464c58">（1筆）</text>
  <!-- 筆界（直線） -->
  <polyline points="330,60 300,150 345,250" fill="none" stroke="#1f2a44" stroke-width="7" stroke-linejoin="miter"/>
  <!-- 筆界点 -->
  <g fill="#c4122f" stroke="#ffffff" stroke-width="2">
    <circle cx="330" cy="60" r="9"/>
    <circle cx="300" cy="150" r="9"/>
    <circle cx="345" cy="250" r="9"/>
  </g>
  <!-- 引き出し線 -->
  <line x1="309" y1="150" x2="380" y2="110" stroke="#c4122f" stroke-width="1.5"/>
  <text x="384" y="108" font-size="15" font-weight="700" fill="#c4122f">筆界点（境の点）</text>
  <line x1="322" y1="200" x2="255" y2="222" stroke="#1f2a44" stroke-width="1.5"/>
  <text x="250" y="228" font-size="15" font-weight="700" text-anchor="end" fill="#1f2a44">点を結ぶ直線</text>
  <!-- 説明 -->
  <text x="320" y="290" font-size="16" fill="#1a1d24" text-anchor="middle">境が曲がっているところも、点と点を直線でつないで表します。</text>
  <text x="320" y="316" font-size="16" fill="#1a1d24" text-anchor="middle">点の位置は、その土地が<tspan font-weight="700">登記されたとき</tspan>に決まっています。</text>
  <g font-size="14" fill="#1a1d24">
    <circle cx="170" cy="342" r="7" fill="#c4122f"/>
    <text x="184" y="347">筆界点</text>
    <line x1="300" y1="342" x2="340" y2="342" stroke="#1f2a44" stroke-width="7"/>
    <text x="348" y="347">筆界（太い実線）</text>
  </g>
</svg>
