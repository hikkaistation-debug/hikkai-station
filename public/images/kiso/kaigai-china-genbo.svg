<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">中国の完成前の住宅の販売で、これまでは骨組みの段階でローンが出ていたのが、完成の手続きのあとにローンが出て引き渡しと同時に所有権の証明書を渡すしくみを目指すことを比べる図</title>
  <rect width="640" height="426" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">中国：完成前の住宅のローンと権利証</text>
  <rect x="20" y="58" width="290" height="58" rx="8" fill="#8a93a3"/>
  <text x="165" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">これまで</text>
  <text x="165" y="105" font-size="13" text-anchor="middle" fill="#fff">（記事より）</text>
  <rect x="20" y="130" width="290" height="39" rx="8" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="34" y="155" font-size="14.5" fill="#1a1d24">完成前の住宅を先に売る</text>
  <line x1="165" y1="171" x2="165" y2="189" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="20" y="193" width="290" height="60" rx="8" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="34" y="218" font-size="14.5" fill="#1a1d24">骨組みができた段階でローンのお金が出</text>
  <text x="34" y="239" font-size="14.5" fill="#1a1d24">て、返済が始まる</text>
  <line x1="165" y1="255" x2="165" y2="273" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="20" y="277" width="290" height="60" rx="8" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="34" y="302" font-size="14.5" fill="#1a1d24">工事が止まると、住めないまま返済だけ</text>
  <text x="34" y="323" font-size="14.5" fill="#1a1d24">が続くことも</text>
  <rect x="330" y="58" width="290" height="58" rx="8" fill="#c4122f"/>
  <text x="475" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">これから</text>
  <text x="475" y="105" font-size="13" text-anchor="middle" fill="#fff">（2026年8月の文書・通知）</text>
  <rect x="330" y="130" width="290" height="60" rx="8" fill="#ffffff" stroke="#c4122f" stroke-width="2"/>
  <text x="344" y="155" font-size="14.5" fill="#1a1d24">完成の手続きが終わってからローンを出</text>
  <text x="344" y="176" font-size="14.5" fill="#1a1d24">す</text>
  <line x1="475" y1="192" x2="475" y2="210" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="330" y="214" width="290" height="60" rx="8" fill="#ffffff" stroke="#c4122f" stroke-width="2"/>
  <text x="344" y="239" font-size="14.5" fill="#1a1d24">完成した住宅を「実際に見て買う」販売</text>
  <text x="344" y="260" font-size="14.5" fill="#1a1d24">を進める</text>
  <line x1="475" y1="276" x2="475" y2="294" stroke="#8a93a3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="330" y="298" width="290" height="60" rx="8" fill="#ffffff" stroke="#c4122f" stroke-width="2"/>
  <text x="344" y="323" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">家の引き渡しと同時に、所有権の証明書</tspan></text>
  <text x="344" y="344" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">も渡す</tspan></text>
  <text x="320" y="378" font-size="13.5" text-anchor="middle" fill="#464c58">※記事の内容をもとにしています。日本では、建物ができたらまず建物の表題登記をします（1か</text>
  <text x="320" y="398" font-size="13.5" text-anchor="middle" fill="#464c58">月以内）。</text>
</svg>
