<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">分筆の登記をすると、1番の土地が1番1と1番2に分かれ、新しい筆界が所有権の境と重なる図</title>
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">本来の形：分筆の登記をしたあと</text>
  <rect x="40" y="60" width="190" height="170" fill="#eef2f8" stroke="#8a93a3" stroke-width="2"/>
  <rect x="230" y="60" width="90" height="170" fill="#f3efe6" stroke="#8a93a3" stroke-width="2"/>
  <rect x="320" y="60" width="280" height="170" fill="#f3efe6" stroke="#8a93a3" stroke-width="2"/>
  <text x="135" y="132" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">1番1の土地</text>
  <text x="135" y="160" font-size="16" text-anchor="middle" fill="#464c58">Aさんのもの</text>
  <text x="275" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1d24">1番2</text>
  <text x="275" y="154" font-size="14" text-anchor="middle" fill="#464c58">の土地</text>
  <text x="275" y="178" font-size="14" text-anchor="middle" fill="#464c58">Bさん</text>
  <text x="460" y="132" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">2番の土地</text>
  <text x="460" y="160" font-size="16" text-anchor="middle" fill="#464c58">Bさんのもの</text>
  <line x1="230" y1="52" x2="230" y2="238" stroke="#1f2a44" stroke-width="7"/>
  <line x1="230" y1="52" x2="230" y2="238" stroke="#c4122f" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="320" y1="52" x2="320" y2="238" stroke="#1f2a44" stroke-width="7"/>
  <text x="224" y="258" font-size="14" font-weight="700" text-anchor="end" fill="#1a1d24">新しい筆界 ＝ 所有権の境 →</text>
  <text x="326" y="258" font-size="14" font-weight="700" fill="#1f2a44">← 元からの筆界</text>
  <text x="320" y="284" font-size="14" text-anchor="middle" fill="#464c58">分筆で「1番」が「1番1」と「1番2」に分かれ、売った部分にも筆界ができる</text>
  <text x="320" y="304" font-size="14" text-anchor="middle" fill="#464c58">→ 登記の上の区切りと、持ち主の区切りがそろう</text>
  <g font-size="14" fill="#1a1d24">
    <line x1="60" y1="326" x2="100" y2="326" stroke="#1f2a44" stroke-width="7"/>
    <text x="108" y="331">筆界（太い実線）</text>
    <line x1="330" y1="326" x2="370" y2="326" stroke="#c4122f" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="378" y="331">所有権の境（赤い点線）</text>
  </g>
</svg>
