<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">登記の床面積は壁などの中心線で囲まれた部分で測り、マンションの部屋などの区分建物は壁の内側の線で測ることを示す図</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">登記の床面積は、どの線で測る？</text>
  <rect x="60" y="70" width="200" height="180" fill="none" stroke="#b9bfca" stroke-width="22"/>
  <rect x="60" y="70" width="200" height="180" fill="#0b62b4" fill-opacity="0.12" stroke="#0b62b4" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="160" y="165" font-size="15" font-weight="700" text-anchor="middle" fill="#0b62b4">床面積</text>
  <text x="160" y="290" font-size="15" text-anchor="middle" fill="#1a1d24">壁などの<tspan font-weight="700">中心線</tspan>で囲む</text>
  <text x="160" y="312" font-size="13.5" text-anchor="middle" fill="#464c58">（基本の測り方）</text>
  <rect x="380" y="70" width="200" height="180" fill="none" stroke="#b9bfca" stroke-width="22"/>
  <rect x="391" y="81" width="178" height="158" fill="#c4122f" fill-opacity="0.12" stroke="#c4122f" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="380" y="70" width="200" height="180" fill="none" stroke="#8a93a3" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="480" y="165" font-size="15" font-weight="700" text-anchor="middle" fill="#c4122f">床面積</text>
  <text x="480" y="290" font-size="15" text-anchor="middle" fill="#1a1d24">壁の<tspan font-weight="700">内側の線</tspan>で囲む</text>
  <text x="480" y="312" font-size="13.5" text-anchor="middle" fill="#464c58">（マンションの部屋などの区分建物）</text>
  <g font-size="12.5" fill="#464c58"><rect x="200" y="330" width="22" height="12" fill="#b9bfca"/><text x="228" y="341">壁</text><line x1="268" y1="336" x2="298" y2="336" stroke="#1f2a44" stroke-width="3" stroke-dasharray="8 5"/><text x="304" y="341">床面積を測る線</text></g>
</svg>
