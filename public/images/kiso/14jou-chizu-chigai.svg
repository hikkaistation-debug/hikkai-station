<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">14条1項地図は精度の高い測量にもとづき、地図に準ずる図面（公図など）は形や長さがおおよそであることを比べる図</title>
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">14条1項地図と、地図に準ずる図面</text>
  <rect x="16" y="56" width="296" height="250" rx="10" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="164" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#0a7d3e">14条1項地図</text>
  <g stroke="#1f2a44" stroke-width="2.5" fill="#eef2f8">
    <polygon points="44,108 160,104 156,190 40,196"/>
    <polygon points="160,104 286,100 290,184 156,190"/>
    <polygon points="40,196 156,190 152,280 44,284"/>
    <polygon points="156,190 290,184 286,276 152,280"/>
  </g>
  <g fill="#c4122f"><circle cx="44" cy="108" r="5"/><circle cx="160" cy="104" r="5"/><circle cx="286" cy="100" r="5"/><circle cx="40" cy="196" r="5"/><circle cx="156" cy="190" r="5"/><circle cx="290" cy="184" r="5"/><circle cx="44" cy="284" r="5"/><circle cx="152" cy="280" r="5"/><circle cx="286" cy="276" r="5"/></g>
  <text x="100" y="152" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">1番</text>
  <text x="222" y="148" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">2番</text>
  <text x="98" y="242" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">3番</text>
  <text x="220" y="236" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">4番</text>
  <text x="166" y="122" font-size="11.5" fill="#c4122f">X=…, Y=…</text>
  <rect x="328" y="56" width="296" height="250" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="476" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#464c58">地図に準ずる図面（公図など）</text>
  <g stroke="#464c58" stroke-width="2" fill="#f3efe6" stroke-linejoin="round">
    <path d="M358,112 Q410,100 470,110 Q466,150 474,192 Q410,186 352,200 Q362,150 358,112 z"/>
    <path d="M470,110 Q540,96 598,112 Q590,150 600,186 Q540,198 474,192 Q466,150 470,110 z"/>
    <path d="M352,200 Q410,186 474,192 Q470,236 478,282 Q414,290 360,276 Q348,240 352,200 z"/>
    <path d="M474,192 Q540,198 600,186 Q606,236 594,278 Q536,272 478,282 Q470,236 474,192 z"/>
  </g>
  <text x="412" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">1番</text>
  <text x="534" y="152" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">2番</text>
  <text x="414" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">3番</text>
  <text x="538" y="240" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">4番</text>
  <text x="164" y="330" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1a1d24">精度の高い測量にもとづく</text>
  <text x="164" y="352" font-size="13.5" text-anchor="middle" fill="#464c58">境目を復元できる可能性が高い</text>
  <text x="476" y="330" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1a1d24">並び方・おおよその形がわかる</text>
  <text x="476" y="352" font-size="13.5" text-anchor="middle" fill="#464c58">長さや面積はそのまま使えない</text>
</svg>
