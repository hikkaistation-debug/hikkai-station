<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">2025年4月1日の測地成果2024への改定で、変わったもの（標高の値・ジオイド・成果値の定義）と、変わっていないもの（緯度・経度の値）を比べる図</title>
  <rect width="640" height="476" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">測地成果2024で、変わったもの・変わらないもの</text>
  <rect x="20" y="58" width="290" height="58" rx="8" fill="#b45309"/>
  <text x="165" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">変わった</text>
  <text x="165" y="105" font-size="13" text-anchor="middle" fill="#fff">2025年4月1日から</text>
  <rect x="20" y="130" width="290" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="155" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">標高</tspan>の値（衛星測位を基盤とする体系</text>
  <text x="34" y="176" font-size="14.5" fill="#1a1d24">へ）</text>
  <rect x="20" y="200" width="290" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="225" font-size="14.5" fill="#1a1d24">ジオイド・モデル：「ジオイド2024日</text>
  <text x="34" y="246" font-size="14.5" fill="#1a1d24">本とその周辺」</text>
  <rect x="20" y="270" width="290" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="295" font-size="14.5" fill="#1a1d24">基準点成果表の成果値の定義：測地成</text>
  <text x="34" y="316" font-size="14.5" fill="#1a1d24">果2011 → 測地成果2024</text>
  <rect x="20" y="340" width="290" height="39" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="365" font-size="14.5" fill="#1a1d24">改定量の最大 三角点：+57cm／−67cm</text>
  <rect x="20" y="389" width="290" height="39" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="34" y="414" font-size="14.5" fill="#1a1d24">改定量の最大 水準点：+23cm／−40cm</text>
  <rect x="330" y="58" width="290" height="40" rx="8" fill="#0a7d3e"/>
  <text x="475" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">変わっていない</text>
  <rect x="330" y="112" width="290" height="39" rx="8" fill="#ffffff" stroke="#0a7d3e" stroke-width="2"/>
  <text x="344" y="137" font-size="14.5" fill="#1a1d24"><tspan font-weight="700">緯度・経度</tspan>の値（測地成果2011のまま）</text>
  <text x="320" y="448" font-size="13.5" text-anchor="middle" fill="#464c58">改定の前後の高さの値がまざらないように注意します。</text>
</svg>
