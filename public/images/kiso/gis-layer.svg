<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">地図の土台・写真・土地の区画・まちの計画・災害の情報のレイヤーを重ねて表示するGISのしくみを示す図</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">GISは、位置をもつデータを「重ねて」見る</text>
  <polygon points="80,100 200,70 340,70 220,100" fill="#c4122f" fill-opacity="0.16" stroke="#c4122f" stroke-width="2.5"/>
  <text x="370" y="84" font-size="16" font-weight="700" text-anchor="start" fill="#c4122f">災害の情報</text>
  <text x="370" y="104" font-size="13.5" text-anchor="start" fill="#464c58">ハザードマップ</text>
  <polygon points="80,164 200,134 340,134 220,164" fill="#6d28a8" fill-opacity="0.16" stroke="#6d28a8" stroke-width="2.5"/>
  <text x="370" y="148" font-size="16" font-weight="700" text-anchor="start" fill="#6d28a8">まちの計画</text>
  <text x="370" y="168" font-size="13.5" text-anchor="start" fill="#464c58">用途地域など</text>
  <polygon points="80,228 200,198 340,198 220,228" fill="#1f2a44" fill-opacity="0.16" stroke="#1f2a44" stroke-width="2.5"/>
  <text x="370" y="212" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a44">土地の区画</text>
  <text x="370" y="232" font-size="13.5" text-anchor="start" fill="#464c58">登記所備付地図のデータ・地番図</text>
  <polygon points="80,292 200,262 340,262 220,292" fill="#0a7d3e" fill-opacity="0.16" stroke="#0a7d3e" stroke-width="2.5"/>
  <text x="370" y="276" font-size="16" font-weight="700" text-anchor="start" fill="#0a7d3e">写真</text>
  <text x="370" y="296" font-size="13.5" text-anchor="start" fill="#464c58">航空写真</text>
  <polygon points="80,356 200,326 340,326 220,356" fill="#b45309" fill-opacity="0.16" stroke="#b45309" stroke-width="2.5"/>
  <text x="370" y="340" font-size="16" font-weight="700" text-anchor="start" fill="#b45309">地図の土台</text>
  <text x="370" y="360" font-size="13.5" text-anchor="start" fill="#464c58">地形図、道路地図</text>
  <text x="320" y="400" font-size="13.5" text-anchor="middle" fill="#464c58">たとえば、公図のデータと航空写真を重ねると、土地の今の使われ方がひと目でわかります。</text>
</svg>
