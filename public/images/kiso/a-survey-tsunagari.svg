<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">エーサーベイのAndroid版がトータルステーションやGNSS受信機とつながり、パソコン版とデータをやりとりする様子を示した図</title>
  <rect width="640" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">エーサーベイ（A-Survey）のつながり</text>
  <rect x="20" y="64" width="170" height="70" rx="10" fill="#eef2f8" stroke="#8a93a3" stroke-width="2"/>
  <text x="105" y="94" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1a1d24">トータルステーション</text>
  <text x="105" y="116" font-size="12.5" text-anchor="middle" fill="#464c58">トプコン・ニコンなど</text>
  <rect x="20" y="164" width="170" height="70" rx="10" fill="#eef2f8" stroke="#8a93a3" stroke-width="2"/>
  <text x="105" y="194" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1a1d24">GNSS受信機</text>
  <text x="105" y="216" font-size="12.5" text-anchor="middle" fill="#464c58">Droggerなど</text>
  <rect x="240" y="84" width="160" height="130" rx="14" fill="#fdf2e9" stroke="#b45309" stroke-width="3"/>
  <text x="320" y="118" font-size="17" font-weight="700" text-anchor="middle" fill="#b45309">A-SurveyAd</text>
  <text x="320" y="142" font-size="13.5" text-anchor="middle" fill="#464c58">Androidの</text>
  <text x="320" y="160" font-size="13.5" text-anchor="middle" fill="#464c58">スマートフォン・</text>
  <text x="320" y="178" font-size="13.5" text-anchor="middle" fill="#464c58">タブレット</text>
  <text x="320" y="200" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1d24">現場で観測と計算</text>
  <rect x="450" y="104" width="170" height="90" rx="10" fill="#f3efe6" stroke="#8a93a3" stroke-width="2"/>
  <text x="535" y="136" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">A-SurveyPC</text>
  <text x="535" y="158" font-size="12.5" text-anchor="middle" fill="#464c58">Windowsのパソコン</text>
  <text x="535" y="178" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1d24">事務所で計算</text>
  <line x1="194" y1="99" x2="236" y2="130" stroke="#8a93a3" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="194" y1="199" x2="236" y2="170" stroke="#8a93a3" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="214" y="153" font-size="11.5" text-anchor="middle" fill="#464c58">Bluetooth・</text>
  <text x="214" y="167" font-size="11.5" text-anchor="middle" fill="#464c58">ケーブル</text>
  <line x1="404" y1="149" x2="446" y2="149" stroke="#8a93a3" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="425" y="134" font-size="11.5" text-anchor="middle" fill="#464c58">データ</text>
  <text x="320" y="262" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1a1d24">図面・データ：DXF・SIMA・LandXML（TIN）・CSV など</text>
  <text x="320" y="292" font-size="13" text-anchor="middle" fill="#464c58">対応する機種や機能は、公式サイトの対応表と更新履歴で確かめてください。</text>
</svg>
