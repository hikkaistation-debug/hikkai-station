<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">社格（神社の格付け）の図。明治4年に定められ、昭和21年に廃止。官社は官幣社と国幣社で、それぞれ大社・中社・小社。諸社は府県社・郷社・村社。社格のない神社は無格社。登記簿では村社○○神社、無格社○○社のように名前の前に付いている</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="32" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1d24">社格（神社の格付け）</text>
  <text x="320" y="56" font-size="13.5" text-anchor="middle" fill="#464c58">明治4年（1871年）に定められ、昭和21年（1946年）に廃止</text>

  <rect x="20" y="74" width="190" height="200" rx="10" fill="#f7f6f2" stroke="#9aa0aa" stroke-width="1.5"/>
  <text x="115" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">官社</text>
  <text x="115" y="120" font-size="12.5" text-anchor="middle" fill="#464c58">国が扱った神社</text>
  <rect x="38" y="134" width="154" height="56" rx="6" fill="#ffffff" stroke="#9aa0aa"/>
  <text x="115" y="158" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1a1d24">官幣社</text>
  <text x="115" y="178" font-size="12.5" text-anchor="middle" fill="#464c58">大社・中社・小社</text>
  <rect x="38" y="200" width="154" height="56" rx="6" fill="#ffffff" stroke="#9aa0aa"/>
  <text x="115" y="224" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1a1d24">国幣社</text>
  <text x="115" y="244" font-size="12.5" text-anchor="middle" fill="#464c58">大社・中社・小社</text>

  <rect x="225" y="74" width="190" height="200" rx="10" fill="#e8f5ee" stroke="#0a7d3e" stroke-width="2"/>
  <text x="320" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#0a7d3e">諸社</text>
  <rect x="243" y="116" width="154" height="40" rx="6" fill="#ffffff" stroke="#0a7d3e"/>
  <text x="320" y="141" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1d24">府県社（府社・県社）</text>
  <rect x="243" y="166" width="154" height="40" rx="6" fill="#ffffff" stroke="#0a7d3e"/>
  <text x="320" y="191" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1a1d24">郷社</text>
  <rect x="243" y="216" width="154" height="40" rx="6" fill="#0a7d3e"/>
  <text x="320" y="241" font-size="14.5" font-weight="700" text-anchor="middle" fill="#ffffff">村社</text>

  <rect x="430" y="74" width="190" height="200" rx="10" fill="#e8f5ee" stroke="#0a7d3e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="525" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#0a7d3e">無格社</text>
  <text x="525" y="150" font-size="13.5" text-anchor="middle" fill="#1a1d24">社格のない神社</text>
  <text x="525" y="174" font-size="13.5" text-anchor="middle" fill="#1a1d24">小さな神社や</text>
  <text x="525" y="196" font-size="13.5" text-anchor="middle" fill="#1a1d24">祠（ほこら）に多い</text>

  <rect x="20" y="290" width="600" height="56" rx="8" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="34" y="313" font-size="13.5" fill="#1a1d24"><tspan font-weight="700">登記簿では</tspan>：「村社○○神社」「無格社○○社」のように、名前の前に付いています</text>
  <text x="34" y="334" font-size="13.5" fill="#1a1d24">今の宗教法人の名称は、社格を付けずに「○○神社」となっていることが多いです</text>
</svg>
