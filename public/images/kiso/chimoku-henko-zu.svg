<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">登記簿は畑のままでも家が建てば今の使い方は宅地になり、1か月以内に地目変更登記をすることを示す図</title>
  <rect width="640" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a7d3e"/></marker></defs>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">使い方が変わったら、地目変更登記</text>
  <rect x="20" y="60" width="170" height="170" rx="10" fill="#f3efe6" stroke="#8a93a3" stroke-width="2"/>
  <text x="105" y="88" font-size="14" text-anchor="middle" fill="#464c58">登記簿では</text>
  <text x="105" y="124" font-size="34" font-weight="700" text-anchor="middle" fill="#1a1d24">畑</text>
  <g stroke="#6b8f3a" stroke-width="3"><line x1="50" y1="160" x2="160" y2="160"/><line x1="50" y1="176" x2="160" y2="176"/><line x1="50" y1="192" x2="160" y2="192"/><line x1="50" y1="208" x2="160" y2="208"/></g>
  <line x1="196" y1="145" x2="236" y2="145" stroke="#8a93a3" stroke-width="3" marker-end="url(#a)"/>
  <rect x="240" y="60" width="170" height="170" rx="10" fill="#eef2f8" stroke="#8a93a3" stroke-width="2"/>
  <text x="325" y="88" font-size="14" text-anchor="middle" fill="#464c58">今の使い方</text>
  <g fill="#ffffff" stroke="#1f2a44" stroke-width="3" stroke-linejoin="round"><polygon points="285,175 325,140 365,175"/><rect x="293" y="175" width="64" height="44"/></g>
  <rect x="317" y="193" width="16" height="26" fill="#1f2a44"/>
  <text x="325" y="124" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">家が建った</text>
  <line x1="416" y1="145" x2="456" y2="145" stroke="#0a7d3e" stroke-width="3" marker-end="url(#a)"/>
  <rect x="460" y="60" width="160" height="170" rx="10" fill="#e8f4ec" stroke="#0a7d3e" stroke-width="2"/>
  <text x="540" y="88" font-size="14" text-anchor="middle" fill="#464c58">登記簿を直す</text>
  <text x="540" y="132" font-size="34" font-weight="700" text-anchor="middle" fill="#0a7d3e">宅地</text>
  <text x="540" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">地目変更登記</text>
  <text x="540" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#c4122f">1か月以内</text>
  <text x="320" y="266" font-size="14.5" text-anchor="middle" fill="#464c58">地目は、土地の<tspan font-weight="700">今の使い方（現況）</tspan>で判断されます。登録免許税はかかりません。</text>
  <text x="320" y="292" font-size="14.5" text-anchor="middle" fill="#464c58">田・畑から変えるときは、先に<tspan font-weight="700">農地法の許可や届出</tspan>が必要です。</text>
</svg>
