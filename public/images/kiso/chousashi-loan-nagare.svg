<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">家を建てて住宅ローンを組むときの登記の順番。家が完成したら、土地家屋調査士が建物表題登記で登記簿の表題部を作り、そのあと司法書士が所有権保存登記と抵当権設定登記で権利部に書く図</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#464c58"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">家を建てて住宅ローンを組むときの登記の順番</text>

  <!-- ① 家が完成 -->
  <rect x="30" y="60" width="170" height="110" rx="8" fill="#f6f7f9" stroke="#8a93a3" stroke-width="2"/>
  <text x="115" y="108" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1d24">① 家が完成</text>
  <text x="115" y="134" font-size="14" text-anchor="middle" fill="#464c58">まだ登記簿は</text>
  <text x="115" y="153" font-size="14" text-anchor="middle" fill="#464c58">ない状態</text>

  <line x1="202" y1="115" x2="231" y2="115" stroke="#464c58" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ② 土地家屋調査士 -->
  <rect x="235" y="60" width="170" height="110" rx="8" fill="#eef2f8" stroke="#1f2a44" stroke-width="2"/>
  <path d="M235,68 a8,8 0 0 1 8,-8 h154 a8,8 0 0 1 8,8 v20 h-170 z" fill="#1f2a44"/>
  <text x="320" y="81" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">土地家屋調査士</text>
  <text x="320" y="113" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1d24">② 建物表題登記</text>
  <text x="320" y="138" font-size="13" text-anchor="middle" fill="#464c58">建物の場所・構造・</text>
  <text x="320" y="156" font-size="13" text-anchor="middle" fill="#464c58">床面積を登記する</text>

  <line x1="407" y1="115" x2="436" y2="115" stroke="#464c58" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ③ 司法書士 -->
  <rect x="440" y="60" width="170" height="110" rx="8" fill="#f8f1e4" stroke="#8a6d3b" stroke-width="2"/>
  <path d="M440,68 a8,8 0 0 1 8,-8 h154 a8,8 0 0 1 8,8 v20 h-170 z" fill="#8a6d3b"/>
  <text x="525" y="81" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">司法書士</text>
  <text x="525" y="113" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">③ 所有権保存登記</text>
  <text x="525" y="133" font-size="13" text-anchor="middle" fill="#464c58">持ち主を登記する</text>
  <text x="525" y="157" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1d24">④ 抵当権設定登記</text>

  <!-- 登記簿 -->
  <rect x="60" y="200" width="490" height="125" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="2"/>
  <text x="76" y="221" font-size="14" font-weight="700" fill="#1a1d24">建物の登記簿</text>
  <rect x="76" y="232" width="458" height="40" fill="#eef2f8" stroke="#1f2a44" stroke-width="1.5"/>
  <text x="90" y="257" font-size="14" font-weight="700" fill="#1f2a44">表題部</text>
  <text x="150" y="257" font-size="14" fill="#1a1d24">建物の姿（場所・種類・構造・床面積）</text>
  <rect x="76" y="277" width="458" height="40" fill="#f8f1e4" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="90" y="302" font-size="14" font-weight="700" fill="#6e5530">権利部</text>
  <text x="150" y="302" font-size="14" fill="#1a1d24">持ち主・ローンの担保（抵当権）</text>

  <!-- つなぐ線 -->
  <line x1="320" y1="172" x2="320" y2="229" stroke="#1f2a44" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <polyline points="590,172 590,297 538,297" fill="none" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <text x="320" y="356" font-size="14" text-anchor="middle" fill="#464c58">表題部ができてはじめて、権利部（持ち主やローンの担保）の登記ができる</text>
</svg>
