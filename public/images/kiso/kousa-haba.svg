<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">200平方メートルの土地の地積測定の公差を、精度区分ごとに比べた図。甲二は約プラスマイナス1.24平方メートル、乙一は約3.54平方メートル、乙三は約14.52平方メートル</title>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">200㎡の土地の「地積の公差」（許される差の幅）</text>
  <line x1="320.0" y1="62" x2="320.0" y2="250" stroke="#8a93a3" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="40" y="81" font-size="16" font-weight="700" fill="#1f2a44">甲二（市街地（宅地など））　±1.24㎡</text>
  <rect x="299.9" y="89" width="40.3" height="16" rx="4" fill="#1f2a44" opacity="0.85"/>
  <text x="40" y="141" font-size="16" font-weight="700" fill="#c4122f">乙一（村落・農耕地）　±3.54㎡</text>
  <rect x="262.5" y="149" width="115.1" height="16" rx="4" fill="#c4122f" opacity="0.85"/>
  <text x="40" y="201" font-size="16" font-weight="700" fill="#464c58">乙三（山林・原野）　±14.52㎡</text>
  <rect x="84.1" y="209" width="471.8" height="16" rx="4" fill="#464c58" opacity="0.85"/>
  <line x1="60.0" y1="250" x2="580.0" y2="250" stroke="#464c58" stroke-width="2"/>
  <line x1="76.3" y1="250" x2="76.3" y2="258" stroke="#464c58" stroke-width="2"/>
  <text x="76.3" y="276" font-size="14" text-anchor="middle" fill="#464c58">185</text>
  <line x1="157.5" y1="250" x2="157.5" y2="258" stroke="#464c58" stroke-width="2"/>
  <text x="157.5" y="276" font-size="14" text-anchor="middle" fill="#464c58">190</text>
  <line x1="238.8" y1="250" x2="238.8" y2="258" stroke="#464c58" stroke-width="2"/>
  <text x="238.8" y="276" font-size="14" text-anchor="middle" fill="#464c58">195</text>
  <line x1="320.0" y1="250" x2="320.0" y2="258" stroke="#464c58" stroke-width="2"/>
  <text x="320.0" y="276" font-size="14" text-anchor="middle" fill="#464c58">200</text>
  <line x1="401.3" y1="250" x2="401.3" y2="258" stroke="#464c58" stroke-width="2"/>
  <text x="401.3" y="276" font-size="14" text-anchor="middle" fill="#464c58">205</text>
  <line x1="482.5" y1="250" x2="482.5" y2="258" stroke="#464c58" stroke-width="2"/>
  <text x="482.5" y="276" font-size="14" text-anchor="middle" fill="#464c58">210</text>
  <line x1="563.8" y1="250" x2="563.8" y2="258" stroke="#464c58" stroke-width="2"/>
  <text x="563.8" y="276" font-size="14" text-anchor="middle" fill="#464c58">215</text>
  <text x="600" y="294" font-size="13" text-anchor="end" fill="#464c58">（㎡）</text>
</svg>
