<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 361" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">土地家屋調査士試験の1年の流れを示す図</title>
  <rect width="640" height="361" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">土地家屋調査士試験の流れ（例年）</text>
  <line x1="158" y1="79" x2="158" y2="269" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="158" cy="79" r="9" fill="#fff" stroke="#0f766e" stroke-width="4"/>
  <text x="136" y="84" font-size="14" font-weight="700" text-anchor="end" fill="#464c58">夏ごろ</text>
  <text x="184" y="85" font-size="17" font-weight="700" fill="#1a1d24">受験の申請</text>
  <circle cx="158" cy="122" r="9" fill="#fff" stroke="#0f766e" stroke-width="4"/>
  <text x="136" y="127" font-size="14" font-weight="700" text-anchor="end" fill="#464c58">秋（10月ごろ）</text>
  <text x="184" y="128" font-size="17" font-weight="700" fill="#1a1d24">筆記試験</text>
  <text x="184" y="152" font-size="14.5" fill="#464c58">午前の部（測量・作図）と午後の部（択一・記述）。午前の部</text>
  <text x="184" y="173" font-size="14.5" fill="#464c58">は、測量士補などの資格があれば申請して免除</text>
  <circle cx="158" cy="206" r="9" fill="#fff" stroke="#0f766e" stroke-width="4"/>
  <text x="136" y="211" font-size="14" font-weight="700" text-anchor="end" fill="#464c58">冬（1月ごろ）</text>
  <text x="184" y="212" font-size="17" font-weight="700" fill="#1a1d24">口述試験</text>
  <text x="184" y="236" font-size="14.5" fill="#464c58">筆記試験の合格者が受ける面接の形の試験</text>
  <circle cx="158" cy="269" r="9" fill="#fff" stroke="#0f766e" stroke-width="4"/>
  <text x="136" y="274" font-size="14" font-weight="700" text-anchor="end" fill="#464c58">口述試験のあと</text>
  <text x="184" y="275" font-size="17" font-weight="700" fill="#0f766e">最終合格の発表</text>
  <text x="30" y="307" font-size="14" fill="#464c58">※試験の内容は年度によって変わることがあります。必ず最新の受験案内書で確認してくだ</text>
  <text x="30" y="327" font-size="14" fill="#464c58">さい。</text>
</svg>
