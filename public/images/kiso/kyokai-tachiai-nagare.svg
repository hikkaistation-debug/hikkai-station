<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 357" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" role="img" aria-labelledby="t">
  <title id="t">境界の立ち会いの当日の流れを4つの段階で示す図</title>
  <rect width="640" height="357" fill="#ffffff"/>
  <text x="320" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1d24">立ち会いの当日の流れ</text>
  <line x1="50" y1="79" x2="50" y2="289" stroke="#c4122f" stroke-width="8" stroke-linecap="round"/>
  <circle cx="50" cy="79" r="13" fill="#fff" stroke="#c4122f" stroke-width="4"/>
  <text x="50" y="84" font-size="14" font-weight="700" text-anchor="middle" fill="#c4122f">1</text>
  <text x="76" y="85" font-size="17" font-weight="700" fill="#1a1d24">土地家屋調査士が説明する</text>
  <text x="76" y="109" font-size="14.5" fill="#464c58">資料と測量の結果から考えた境目の位置を説明します</text>
  <circle cx="50" cy="142" r="13" fill="#fff" stroke="#c4122f" stroke-width="4"/>
  <text x="50" y="147" font-size="14" font-weight="700" text-anchor="middle" fill="#c4122f">2</text>
  <text x="76" y="148" font-size="17" font-weight="700" fill="#1a1d24">現地で一緒に見る</text>
  <text x="76" y="172" font-size="14.5" fill="#464c58">境界標や印の位置を、お隣と一緒に確かめます</text>
  <circle cx="50" cy="205" r="13" fill="#fff" stroke="#c4122f" stroke-width="4"/>
  <text x="50" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#c4122f">3</text>
  <text x="76" y="211" font-size="17" font-weight="700" fill="#1a1d24">納得できたら署名・押印</text>
  <text x="76" y="235" font-size="14.5" fill="#464c58">後日（またはその場で）<tspan font-weight="700">境界確認書</tspan>に署名・押印します。わからなければ保留し</text>
  <text x="76" y="256" font-size="14.5" fill="#464c58">てかまいません</text>
  <circle cx="50" cy="289" r="13" fill="#fff" stroke="#c4122f" stroke-width="4"/>
  <text x="50" y="294" font-size="14" font-weight="700" text-anchor="middle" fill="#c4122f">4</text>
  <text x="76" y="295" font-size="17" font-weight="700" fill="#1a1d24">境界標が入る</text>
  <text x="76" y="319" font-size="14.5" fill="#464c58">確認した位置に境界標が入ります。境界確認書の写しは大切に保管します</text>
</svg>
